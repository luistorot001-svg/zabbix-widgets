        - uuid: b6b0164b428f4f6da88eebd7e43f9dcc
          name: 'QoS SIP (DSCP)'
          type: DEPENDENT
          key: gs.qos.sip
          delay: '0'
          history: 90d
          description: 'Layer 3 QoS de la señalización SIP (P1558, validado en GRP y GXV). 26 = AF31.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value);
                  if (!d.qos || d.qos.sip === null || d.qos.sip === undefined) throw 'sin dato de QoS SIP';
                  return d.qos.sip;
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: qos
          triggers:
            - uuid: a3be13ff48664386be729d26e7793f73
              expression: 'last(/Grandstream IP Phone by HTTP/gs.qos.sip)<>{$GS.DSCP.SIP}'
              name: 'Grandstream {HOST.NAME}: QoS SIP con DSCP {ITEM.LASTVALUE} (se espera {$GS.DSCP.SIP})'
              priority: WARNING
              description: 'El teléfono marca la señalización SIP con un DSCP distinto del esperado.'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: config
        - uuid: 471edd15e39c44eda6721582add3ed6a
          name: 'SNMP: descripción del sistema'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.1.0
          key: gs.snmp.sysdescr
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'sysDescr (MIB-II): kernel del teléfono.'
          inventory_link: OS
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: 85a573e6dfd547e99536c9317852cc92
          name: 'SNMP: nombre del sistema'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.5.0
          key: gs.snmp.sysname
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'sysName: <modelo>_<MAC>, ej. gxp2135_000b82cc92be.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: f75426814bd94b5c85440337a10430ac
          name: 'SNMP: uptime del sistema'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.2.1.1.3.0
          key: gs.snmp.uptime
          delay: '{$GS.SNMP.INTERVAL}'
          history: 90d
          units: uptime
          description: 'sysUpTime (MIB-II). Detecta reinicios: PoE, energía o cuelgues.'
          preprocessing:
            - type: MULTIPLIER
              parameters:
                - '0.01'
          tags:
            - tag: component
              value: sistema
            - tag: source
              value: snmp
          triggers:
            - uuid: f98f01b39c664c18ba979ca6809b22a8
              expression: 'last(/Grandstream IP Phone by HTTP/gs.snmp.uptime)<10m'
              name: 'Grandstream {HOST.NAME}: el teléfono se reinició (uptime {ITEM.LASTVALUE})'
              priority: WARNING
              description: 'Reinicio en los últimos 10 minutos. Si no fue programado, revisar PoE/energía del puerto.'
              manual_close: 'YES'
              tags:
                - tag: scope
                  value: availability
            - uuid: 5ef70facf71e44c78b57af0144f4bdc7
              expression: 'nodata(/Grandstream IP Phone by HTTP/gs.snmp.uptime,{$GS.SNMP.NODATA})=1'
              name: 'Grandstream {HOST.NAME}: SNMP no responde ({$GS.SNMP.NODATA})'
              priority: WARNING
              description: 'Responde a ping pero no a SNMP: SNMP deshabilitado, versión o comunidad incorrecta (macro SNMP_COMMUNITY) o falta la interfaz SNMP en el host. Sin SNMP no hay registro ni DND.'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: 8075764ab92c4d0b8e41e28655c8248c
          name: 'Volumen de llamada'
          type: DEPENDENT
          key: gs.volume.call
          delay: '0'
          history: 90d
          description: 'Solo GXV34xx (/api/devVolume). Escala del modelo: en GXV3450 de 1 a 8. Sin dato en GXP y GRP (no lo exponen).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.volume.call.cur
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: audio
          triggers:
            - uuid: 1b64c3f14fcb47cb8276674704a48583
              expression: 'last(/Grandstream IP Phone by HTTP/gs.volume.call)>={$GS.VOLUME.CALL.MAX}'
              name: 'Grandstream {HOST.NAME}: volumen de llamada al máximo ({ITEM.LASTVALUE})'
              priority: INFO
              description: 'Puede indicar que el usuario oye bajo (revisar calidad de audio) o provocar eco del lado remoto.'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: config
        - uuid: dc58c85008bd494899db325dcaedbf70
          name: 'Volumen de timbre'
          type: DEPENDENT
          key: gs.volume.ring
          delay: '0'
          history: 90d
          description: 'Solo GXV34xx (/api/devVolume). En GXV3450 de 0 a 15.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.volume.ring.cur
              error_handler: DISCARD_VALUE
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: audio
        - uuid: 875096c93a8e41d195219021b585d757
          name: 'Ping: pérdida'
          type: SIMPLE
          key: 'icmppingloss[,10]'
          delay: '{$GS.ICMP.INTERVAL}'
          history: 90d
          value_type: FLOAT
          units: '%'
          tags:
            - tag: component
              value: red
          triggers:
            - uuid: 54eb9c73d55e4609a660e4a663643a7d
              expression: 'min(/Grandstream IP Phone by HTTP/icmppingloss[,10],5m)>{$GS.ICMP.LOSS.WARN}'
              name: 'Grandstream {HOST.NAME}: pérdida de paquetes alta (>{$GS.ICMP.LOSS.WARN}% por 5 min)'
              priority: WARNING
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: af3a5fb100684c978e3fcabddf86d800
          name: 'Ping: latencia promedio'
          type: SIMPLE
          key: 'icmppingsec[,10,,,,avg]'
          delay: '{$GS.ICMP.INTERVAL}'
          history: 90d
          value_type: FLOAT
          units: s
          tags:
            - tag: component
              value: red
          triggers:
            - uuid: 01f0b0e9a85b4059965088895f86dfc5
              expression: 'min(/Grandstream IP Phone by HTTP/icmppingsec[,10,,,,avg],5m)>{$GS.ICMP.RTT.WARN}'
              name: 'Grandstream {HOST.NAME}: latencia alta (>{$GS.ICMP.RTT.WARN}s por 5 min)'
              priority: WARNING
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: performance
        - uuid: 7f4aa8761f794b9095a0c81763e2d35f
          name: 'Ping: disponible'
          type: SIMPLE
          key: 'icmpping[,3]'
          delay: '{$GS.ICMP.INTERVAL}'
          history: 90d
          valuemap:
            name: 'GS arriba/abajo'
          tags:
            - tag: component
              value: red
          triggers:
            - uuid: ceebe65c770c4131905f5fdd6da299fc
              expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
              priority: HIGH
              description: 'Tres lecturas seguidas sin respuesta: apagado, sin PoE, cable o puerto caído.'
              tags:
                - tag: scope
                  value: availability
      discovery_rules:
        - uuid: 71c05d83694645108208b14f7899bd2a
          name: 'Cuentas SIP configuradas'
          type: DEPENDENT
          key: gs.accounts.discovery
          delay: '0'
          filter:
            conditions:
              - macro: '{#SIPID}'
                value: .+
                formulaid: A
          lifetime: 30d
          enabled_lifetime_type: DISABLE_NEVER
          description: 'Descubre las cuentas con usuario SIP configurado (sip_id no vacío) en la consulta web ({$GS.INTERVAL}). El registro de cada cuenta se lee por SNMP cada {$GS.SNMP.INTERVAL}.'
          item_prototypes:
            - uuid: d44bc15c709d4e6999b34bd8992f095a
              name: 'Cuenta {#ACCOUNT} ({#SIPID}): códecs preferidos'
              type: DEPENDENT
              key: 'gs.account.codecs[{#ACCOUNT}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              description: 'Orden de códecs configurado en la cuenta (sin repetidos). GXP/GRP: P57-P98, P451, P551, P651 (validado en GRP); GXV: solo cuenta 1. El códec usado en cada llamada no lo expone el teléfono.'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.codecs["{#ACCOUNT}"]'
                  error_handler: DISCARD_VALUE
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: gs.poll
              tags:
                - tag: component
                  value: config
                - tag: extension
                  value: '{#SIPID}'
            - uuid: fdb85c1d67424c1f877aa3aec12fda8f
              name: 'Cuenta {#ACCOUNT} ({#SIPID}): Feature Key Sync'
              type: DEPENDENT
              key: 'gs.account.fks[{#ACCOUNT}]'
              delay: '0'
              history: 90d
              description: 'account.N.broadsoft.syncFeatureKey = P(2225 + 100·N): P2325, P2425, P2525, P2625 (validado con metaconfig de GXP2130 y GXP2135). 1 = DND/desvío sincronizados con el conmutador.'
              valuemap:
                name: 'GS sí/no'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d = JSON.parse(value), k = 'P' + (2225 + 100 * {#ACCOUNT});
                      var v = (d.values && d.values.body) ? d.values.body[k] : undefined;
                      if (v === undefined || v === '') throw 'sin dato de ' + k;
                      return v;
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: gs.poll
              tags:
                - tag: component
                  value: config
                - tag: extension
                  value: '{#SIPID}'
              trigger_prototypes:
                - uuid: d1fb6daa81c04041849cd29b6b19d3cf
                  expression: 'find(/Grandstream IP Phone by HTTP/gs.account.fks[{#ACCOUNT}],,"regexp","{$GS.EXPECT.FKS.RE}")=0'
                  name: 'Grandstream {HOST.NAME}: cuenta {#ACCOUNT} ({#SIPID}) con Feature Key Sync fuera de estándar ({ITEM.LASTVALUE})'
                  priority: WARNING
                  description: 'No coincide con {$GS.EXPECT.FKS.RE}. Sin Feature Key Sync, el DND del teléfono no se refleja en el conmutador.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                      expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
                  tags:
                    - tag: scope
                      value: config
            - uuid: e53911f8b9cf44019cd966cb64fcb033
              name: 'Cuenta {#ACCOUNT} ({#SIPID}): registro'
              type: SNMP_AGENT
              snmp_oid: '1.3.6.1.4.1.42397.1.3.2.1.{#ACCOUNT}.0.0'
              key: 'gs.account.reg[{#ACCOUNT}]'
              delay: '{$GS.SNMP.INTERVAL}'
              history: 90d
              description: 'SNMP 42397.1.3.2.1.N (validado: 1 = registrada). Servidor {#SIPSERVER} · nombre {#ACCNAME}.'
              valuemap:
                name: 'GS registro'
              tags:
                - tag: component
                  value: registro
                - tag: extension
                  value: '{#SIPID}'
                - tag: source
                  value: snmp
              trigger_prototypes:
                - uuid: a14bdfc0eb7346b29d95622869dbf0cc
                  expression: 'max(/Grandstream IP Phone by HTTP/gs.account.reg[{#ACCOUNT}],#2)=0'
                  name: 'Grandstream {HOST.NAME}: extensión {#SIPID} no registrada'
                  priority: HIGH
                  description: 'El teléfono reporta por SNMP la cuenta {#ACCOUNT} ({#SIPID}@{#SIPSERVER}) sin registro en dos lecturas seguidas.'
                  dependencies:
                    - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                      expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
                  tags:
                    - tag: scope
                      value: availability
            - uuid: 1e136958676e44d39b716fdfc07e80e7
              name: 'Cuenta {#ACCOUNT} ({#SIPID}): servidor SIP'
              type: DEPENDENT
              key: 'gs.account.server[{#ACCOUNT}]'
              delay: '0'
              history: 90d
              value_type: CHAR
              trends: '0'
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - '$.accounts.body[?(@.id=={#ACCOUNT})].sip_server.first()'
                - type: DISCARD_UNCHANGED_HEARTBEAT
                  parameters:
                    - 1d
              master_item:
                key: gs.poll
              tags:
                - tag: component
                  value: config
                - tag: extension
                  value: '{#SIPID}'
              trigger_prototypes:
                - uuid: 0de64a86d48445218761da0d406d789c
                  expression: 'last(/Grandstream IP Phone by HTTP/gs.account.server[{#ACCOUNT}])<>last(/Grandstream IP Phone by HTTP/gs.account.server[{#ACCOUNT}],#1:now-2d)'
                  name: 'Grandstream {HOST.NAME}: cuenta {#ACCOUNT} ({#SIPID}) cambió de servidor SIP respecto a hace 2 días (ahora {ITEM.LASTVALUE})'
                  priority: AVERAGE
                  description: 'El servidor SIP de la cuenta es distinto al de hace 2 días. Ver History del item para el anterior. Revisar autoprovisionamiento o cambios manuales.'
                  manual_close: 'YES'
                  dependencies:
                    - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                      expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
                  tags:
                    - tag: scope
                      value: cambio
          master_item:
            key: gs.poll
          lld_macro_paths:
            - lld_macro: '{#ACCNAME}'
              path: $.name
            - lld_macro: '{#ACCOUNT}'
              path: $.id
            - lld_macro: '{#SIPID}'
              path: $.sip_id
            - lld_macro: '{#SIPSERVER}'
              path: $.sip_server
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.accounts.body
      tags:
        - tag: class
          value: telephony
        - tag: target
          value: grandstream
      macros:
        - macro: '{$GS.DND.KEY}'
          value: DND
          description: 'Tecla de la acción opcional Alternar DND (api-send_key). No funciona en GXP21xx 1.0.11.x.'
        - macro: '{$GS.DND.MAX}'
          value: 2h
          description: 'Tiempo con DND activo para avisar.'
        - macro: '{$GS.DSCP.RTP}'
          value: '46'
          description: 'DSCP esperado para la voz (RTP). 46 = EF.'
        - macro: '{$GS.DSCP.SIP}'
          value: '26'
          description: 'DSCP esperado para la señalización SIP. 26 = AF31.'
        - macro: '{$GS.EXPECT.FKS.RE}'
          value: '.*'
          description: 'Regex esperada de Feature Key Sync en cada cuenta. Recomendado: ^1$ (.* = no evaluar).'
        - macro: '{$GS.FAMILY}'
          description: 'Vacío = detectar sola la familia del teléfono. GXP, GRP o GXV = forzarla (sin detección).'
        - macro: '{$GS.ICMP.INTERVAL}'
          value: 1m
          description: 'Frecuencia de ping.'
        - macro: '{$GS.ICMP.LOSS.WARN}'
          value: '20'
          description: 'Pérdida (%) para alertar.'
        - macro: '{$GS.ICMP.RTT.WARN}'
          value: '0.15'
          description: 'Latencia promedio (s) para alertar.'
        - macro: '{$GS.INTERVAL}'
          value: 6h
          description: 'Frecuencia de la consulta web (cuentas, servidor SIP, Feature Key Sync). Cada consulta es un login web y saca a quien esté en la página del teléfono (sesión única), por eso es baja. Para una lectura inmediata: Execute now.'
        - macro: '{$GS.LOGOUT}'
          value: '1'
          description: '1 = cerrar sesión al terminar para liberar la única sesión web del teléfono.'
        - macro: '{$GS.NODATA}'
          value: 13h
          description: 'Sin datos de la consulta web este tiempo → aviso (mayor a 2 × {$GS.INTERVAL}).'
        - macro: '{$GS.PASSCODE}'
          type: SECRET_TEXT
          description: 'Contraseña de admin de respaldo (secreta): se usa si la de la familia está vacía.'
        - macro: '{$GS.PASSCODE:"GRP"}'
          type: SECRET_TEXT
          description: 'Contraseña de admin de los GRP (secreta). Vacía = usa {$GS.PASSCODE}.'
        - macro: '{$GS.PASSCODE:"GXP"}'
          type: SECRET_TEXT
          description: 'Contraseña de admin de los GXP (secreta). Vacía = usa {$GS.PASSCODE}.'
        - macro: '{$GS.PASSCODE:"GXV"}'
          type: SECRET_TEXT
          description: 'Contraseña de admin de los GXV34xx (secreta). Vacía = usa {$GS.PASSCODE}.'
        - macro: '{$GS.PORT:"GRP"}'
          value: '443'
          description: 'Puerto web de los GRP (por http el login falla con HTTP 411).'
        - macro: '{$GS.PORT:"GXP"}'
          value: '80'
          description: 'Puerto web de los GXP.'
        - macro: '{$GS.PORT:"GXV"}'
          value: '443'
          description: 'Puerto web de los GXV34xx.'
        - macro: '{$GS.SCHEME:"GRP"}'
          value: https
          description: 'Protocolo web de los GRP.'
        - macro: '{$GS.SCHEME:"GXP"}'
          value: http
          description: 'Protocolo web de los GXP (http o https).'
        - macro: '{$GS.SCHEME:"GXV"}'
          value: https
          description: 'Protocolo web de los GXV34xx.'
        - macro: '{$GS.SNMP.INTERVAL}'
          value: 1m
          description: 'Frecuencia de las consultas SNMP (uptime, registro, DND).'
        - macro: '{$GS.SNMP.NODATA}'
          value: 10m
          description: 'Sin respuesta SNMP este tiempo → aviso.'
        - macro: '{$GS.TIMEOUT}'
          value: 25s
          description: 'Timeout total del item Script (login + consultas). El login del GXV calcula PBKDF2 (unos 3 s).'
        - macro: '{$GS.VOLUME.CALL.MAX}'
          value: '8'
          description: 'Volumen de llamada que se considera "al máximo" (GXV3450: escala 1 a 8).'
        - macro: '{$GS.WEBAPI.KEYS}'
          value: 'P2325:P2425:P2525:P2625'
          description: 'Claves a leer con api.values.get, separadas por dos puntos (Feature Key Sync de las cuentas 1 a 4).'
        - macro: '{$GS.WEBAPI.USER}'
          value: admin
          description: 'Usuario web del teléfono (admin).'
        - macro: '{$SNMP_COMMUNITY}'
          value: public
      valuemaps:
        - uuid: e292a1226ca547efa42b59938b46aa21
          name: 'GS arriba/abajo'
          mappings:
            - value: '0'
              newvalue: Caído
            - value: '1'
              newvalue: Arriba
        - uuid: c157201da9fe432989049aebaac78c2e
          name: 'GS DND'
          mappings:
            - value: '0'
              newvalue: Inactivo
            - value: '1'
              newvalue: Activo
        - uuid: cc8670d779c14ef390f3034a1667de03
          name: 'GS registro'
          mappings:
            - value: '0'
              newvalue: 'No registrada'
            - value: '1'
              newvalue: Registrada
        - uuid: de7a0de6cd4a498a80613dd6f28ff9e2
          name: 'GS sí/no'
          mappings:
            - value: '0'
              newvalue: 'No'
            - value: '1'
              newvalue: Sí
  graphs:
    - uuid: 16b2b24e47d545eb9e18106aff0106f8
      name: 'Grandstream: latencia y pérdida'
      graph_items:
        - color: 2774A4
          item:
            host: 'Grandstream IP Phone by HTTP'
            key: 'icmppingsec[,10,,,,avg]'
        - sortorder: '1'
          color: F63100
          yaxisside: RIGHT
          item:
            host: 'Grandstream IP Phone by HTTP'
            key: 'icmppingloss[,10]'
