zabbix_export:
  version: '7.0'
  template_groups:
    - uuid: e067e3ab9c5c4bff8f2465e3bb302732
      name: Templates/Telephony
  templates:
    - uuid: bd55267fad3c4ef6af04e84030098432
      template: 'Grandstream IP Phone by HTTP'
      name: 'Grandstream IP Phone by HTTP'
      description: |
        Grandstream (GXP16xx/17xx/21xx, GRP26xx, GXV34xx) consultado directo al teléfono, sin depender del conmutador. v1.7.2.
        - SNMP v2c (validado en GXP2135, GXP2130 y GRP2613): uptime/reinicios, registro por cuenta, DND, firmware, número de parte, modelo y MAC.
          Requiere interfaz SNMP (v2c) en el host; la comunidad es {$SNMP_COMMUNITY} del template (public), cámbiala en el template o por host.
        - Consulta web cada {$GS.INTERVAL}: detecta sola si es GXP o GRP (por la página inicial, sin login) y usa el puerto,
          protocolo, contraseña y API de esa familia ({$GS.PORT:"GXP"}/{$GS.PORT:"GRP"}, {$GS.PASSCODE:"GXP"}/{$GS.PASSCODE:"GRP"}).
          Descubre las cuentas y lee servidor SIP, Feature Key Sync, QoS (DSCP de SIP y RTP) y códecs preferidos por cuenta.
          v1.7.2: familia GXV (GXV34xx, login /api con token; validado en GXV3450): además lee volumen de llamada y timbre.
          QoS RTP: P1559 en GRP y GXV (validado); en GXP se lee P1559 y, si está vacío, P38 (GXP NO validado aún).
          El teléfono tiene UNA sola sesión web: cada consulta saca a quien esté en su página; por eso es poco frecuente.
        - Ping: disponibilidad, pérdida y latencia (requiere fping en server/proxy).
        - Llamadas: no se monitorean (SNMP no las expone y la consulta web frecuente saca de la sesión). En prueba: Action URL.
        Requisitos en el teléfono: SNMP habilitado; Remote Control (en GRP: Network Settings > Advanced Settings): Action URI Support activado,
        Popup Window Support desactivado, Allowed IP List con la IP del server/proxy.
        Contraseñas (secretas, vacías): {$GS.PASSCODE:"GXP"}, {$GS.PASSCODE:"GRP"} y {$GS.PASSCODE:"GXV"}; si la de la familia está vacía se usa {$GS.PASSCODE}.
        Para un host con otra contraseña, define en el host la macro con contexto ({$GS.PASSCODE:"GRP"}), no la genérica.
      groups:
        - name: Templates/Telephony
      items:
        - uuid: 9833b7eb588a4f769c860da2065a356a
          name: 'Cuentas SIP configuradas'
          type: DEPENDENT
          key: gs.accounts.configured
          delay: '0'
          history: 90d
          description: 'Foto de la consulta web ({$GS.INTERVAL}).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), b = (d.accounts && d.accounts.body instanceof Array) ? d.accounts.body : null;
                  if (!b) throw 'sin datos de cuentas';
                  var n = 0;
                  for (var i = 0; i < b.length; i++) { if (b[i].sip_id) n++; }
                  return n;
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: registro
        - uuid: 71ba5f23baea4e8aaff42f53bb739f66
          name: 'Extensiones del teléfono'
          type: DEPENDENT
          key: gs.accounts.extensions
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          inventory_link: ALIAS
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), b = (d.accounts && d.accounts.body instanceof Array) ? d.accounts.body : null;
                  if (!b) throw 'sin datos de cuentas';
                  var out = [];
                  for (var i = 0; i < b.length; i++) { if (b[i].sip_id) out.push(b[i].sip_id + (b[i].name ? ' (' + b[i].name + ')' : '')); }
                  return out.length ? out.join(', ') : 'sin cuentas';
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: inventario
        - uuid: 89c103e9ad70496eb152c4c7faf47674
          name: 'Cuentas registradas'
          type: CALCULATED
          key: gs.accounts.registered
          delay: '{$GS.SNMP.INTERVAL}'
          history: 90d
          value_type: FLOAT
          params: 'sum(last_foreach(//gs.account.reg[*]))'
          description: 'Suma de las cuentas registradas (items SNMP "Cuenta N: registro"). Nombre fijo para usarlo como columna en dashboards (Top hosts). Comparar con "Cuentas SIP configuradas". En GXV el registro por SNMP no está validado.'
          tags:
            - tag: component
              value: registro
        - uuid: e4e9f2528f634242bd10a922e745b83f
          name: 'API: respuesta'
          type: DEPENDENT
          key: gs.cti.response
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'success = el teléfono respondió con datos. unauthorized = sin sesión válida (contraseña, usuario o Remote Control). error: = HTTP/red.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d = JSON.parse(value), s = d.phone_status || {};
                  if (s.response === 'success' && s.body !== 'unauthorized') return 'success';
                  if (s.body === 'unauthorized' || s.response === 'success') return 'unauthorized';
                  return 'error: ' + String(s.body || 'sin respuesta').substring(0, 100);
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1h
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: cti
          triggers:
            - uuid: 0a5cb6ead00d4d439e701a5a9fa098b7
              expression: 'last(/Grandstream IP Phone by HTTP/gs.cti.response)<>"success"'
              name: 'Grandstream {HOST.NAME}: la API del teléfono no entrega datos ({ITEM.LASTVALUE})'
              priority: WARNING
              description: 'Revisar las macros de contraseña GS.PASSCODE (por familia) y el usuario GS.WEBAPI.USER, Remote Control > Action URI Support, Popup desactivado y Allowed IP List. Detalle en el item "API: errores" y "API: familia detectada".'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: notice
            - uuid: ab912552c2994fd8bc0ea39d8e8f35c4
              expression: 'nodata(/Grandstream IP Phone by HTTP/gs.cti.response,{$GS.NODATA})=1'
              name: 'Grandstream {HOST.NAME}: sin datos de la API ({$GS.NODATA})'
              priority: AVERAGE
              description: 'El item Script no devuelve datos: timeout, servicio web caído o esquema/puerto incorrecto.'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: availability
        - uuid: bb4c75c2726a42bd9b51f094cde5a6e9
          name: 'API: familia detectada'
          type: DEPENDENT
          key: gs.family
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'GXP, GRP o GXV: método, puerto, protocolo y contraseña que usó la consulta web. Se fuerza con {$GS.FAMILY}.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.family
              error_handler: CUSTOM_VALUE
              error_handler_params: n/d
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: cti
        - uuid: 2f31b6e074164c8baa1aecefeda4447e
          name: Firmware
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.42397.1.3.3.4.0.0
          key: gs.inv.firmware
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Versión de Programa (42397.1.3.3.4). Validado contra la API web (clave 68).'
          inventory_link: SOFTWARE
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
          triggers:
            - uuid: 2052cff498dc42ccb78f51f274600ef4
              expression: 'last(/Grandstream IP Phone by HTTP/gs.inv.firmware)<>last(/Grandstream IP Phone by HTTP/gs.inv.firmware,#1:now-2d)'
              name: 'Grandstream {HOST.NAME}: cambió el firmware respecto a hace 2 días (ahora {ITEM.LASTVALUE})'
              priority: INFO
              description: 'El valor actual es distinto al de hace 2 días. Ver History del item para el valor anterior. Se resuelve solo cuando pasan 2 días con el valor nuevo, o se puede cerrar a mano.'
              manual_close: 'YES'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: cambio
        - uuid: e52fb9bb859c4a06be6982c3a455a125
          name: 'Firmware: versión de boot'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.42397.1.3.3.1.0.0
          key: gs.inv.firmware.boot
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Versión de Boot (42397.1.3.3.1). Core y Base están en 42397.1.3.3.2 y .3.3.3.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: 97830c0109ee47d99b3cac0d99cdccda
          name: MAC
          type: DEPENDENT
          key: gs.inv.mac
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Sale de sysName (SNMP).'
          inventory_link: MACADDRESS_A
          preprocessing:
            - type: REGEX
              parameters:
                - '_([0-9A-Fa-f]{12})$'
                - \1
            - type: JAVASCRIPT
              parameters:
                - 'return value.toUpperCase().match(/../g).join(":");'
          master_item:
            key: gs.snmp.sysname
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: 236b5b4be85d476497fc2a4e95e0a77e
          name: Modelo
          type: DEPENDENT
          key: gs.inv.model
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Sale de sysName (SNMP).'
          inventory_link: MODEL
          preprocessing:
            - type: REGEX
              parameters:
                - '^([A-Za-z0-9]+)_'
                - \1
            - type: JAVASCRIPT
              parameters:
                - 'return value.toUpperCase();'
          master_item:
            key: gs.snmp.sysname
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: 3b4c73b5f3ca4a978871002861aa0400
          name: 'Número de parte'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.42397.1.3.1.0.0
          key: gs.inv.partnumber
          delay: 1h
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'Rama Grandstream 42397.1.3.1 (validado: 9620007114A en GXP2135). Sin inventario por ahora: el campo Hardware lo usaba Versión de hardware de la v1.5.1.'
          preprocessing:
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          tags:
            - tag: component
              value: inventario
            - tag: source
              value: snmp
        - uuid: edf79b585b424642b9c52b939311064a
          name: 'API: método de login'
          type: DEPENDENT
          key: gs.login
          delay: '0'
          history: 90d
          value_type: CHAR
          trends: '0'
          description: 'token = firmware nuevo (SHA256), plain = firmware anterior, none = sin sesión (inventario/config no disponibles).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.login
            - type: DISCARD_UNCHANGED_HEARTBEAT
              parameters:
                - 1d
          master_item:
            key: gs.poll
          tags:
            - tag: component
              value: cti
        - uuid: e9d6cedbd36f4190be97bb2a8ea00a0d
          name: 'DND (No molestar)'
          type: SNMP_AGENT
          snmp_oid: 1.3.6.1.4.1.42397.1.3.2.2.0.0
          key: gs.phone.dnd
          delay: '{$GS.SNMP.INTERVAL}'
          history: 90d
          description: 'Rama Grandstream 42397.1.3.2.2. Validado: 1 al activar DND, 0 al desactivar. Es global del teléfono.'
          valuemap:
            name: 'GS DND'
          tags:
            - tag: component
              value: llamada
            - tag: source
              value: snmp
          triggers:
            - uuid: 56c8d78e167d4e48893ec5d9a77ee599
              expression: 'min(/Grandstream IP Phone by HTTP/gs.phone.dnd,{$GS.DND.MAX})=1'
              name: 'Grandstream {HOST.NAME}: DND activo por más de {$GS.DND.MAX}'
              priority: INFO
              description: 'La extensión no recibe llamadas. Confirmar con el usuario si es intencional.'
              manual_close: 'YES'
              dependencies:
                - name: 'Grandstream {HOST.NAME}: sin respuesta a ping'
                  expression: 'max(/Grandstream IP Phone by HTTP/icmpping[,3],#3)=0'
              tags:
                - tag: scope
                  value: notice
        - uuid: b7bf1639f39445dea29e92682d7359e8
          name: 'Consulta al teléfono (crudo)'
          type: SCRIPT
          key: gs.poll
          delay: '{$GS.INTERVAL}'
          history: '0'
          value_type: TEXT
          trends: '0'
          params: |
            // GS-Monitor · item Script de Zabbix 6.0 (ES5 / Duktape).
            // Detecta la familia del teléfono (GXP o GRP) sin login, inicia sesión con la contraseña de esa familia,
            // lee CTI + configuración y cierra sesión.
            // GXP (fw 1.0.11.x): access -> token; dologin con SHA256(password + token) -> sid; CTI exige la sesión (cookies).
            //   Firmware anterior: dologin en claro, o CTI solo con ?passcode=.
            // GRP (fw 1.0.13.x): mismo login por HTTPS; además exige las cookies que pone su web (sid, device, version,
            //   locale, oem); estado por POST con sid; configuración y registro por config_get (pvalues sin la P).
            // OJO: Zabbix sustituye macros también dentro de este código; no escribir nombres de macro con llave y signo de pesos aquí.
            var p = JSON.parse(value);
            var out = { login: 'none', family: 'n/d', errors: [] };
            var cookies = {};
            var base = '';
            
            function gsSha256(ascii) {
              function rr(v, a) { return (v >>> a) | (v << (32 - a)); }
              var mw = Math.pow(2, 32), res = '', w = [], h = [], k = [], pc = 0, ic = {}, i, j, c;
              for (c = 2; pc < 64; c++) {
                if (!ic[c]) {
                  for (i = 0; i < 313; i += c) ic[i] = c;
                  h[pc] = (Math.pow(c, 0.5) * mw) | 0;
                  k[pc++] = (Math.pow(c, 1 / 3) * mw) | 0;
                }
              }
              h = h.slice(0, 8);
              ascii = unescape(encodeURIComponent(ascii));
              var L = ascii.length * 8;
              ascii += '\x80';
              while (ascii.length % 64 - 56) ascii += '\x00';
              for (i = 0; i < ascii.length; i++) { j = ascii.charCodeAt(i); w[i >> 2] |= j << ((3 - i) % 4) * 8; }
              w[w.length] = (L / mw) | 0;
              w[w.length] = L;
              for (j = 0; j < w.length;) {
                var W = w.slice(j, j += 16), oh = h;
                h = h.slice(0, 8);
                for (i = 0; i < 64; i++) {
                  var w15 = W[i - 15], w2 = W[i - 2], a = h[0], e = h[4];
                  var t1 = h[7] + (rr(e, 6) ^ rr(e, 11) ^ rr(e, 25)) + ((e & h[5]) ^ ((~e) & h[6])) + k[i] +
                    (W[i] = (i < 16) ? W[i] : (W[i - 16] + (rr(w15, 7) ^ rr(w15, 18) ^ (w15 >>> 3)) + W[i - 7] +
                      (rr(w2, 17) ^ rr(w2, 19) ^ (w2 >>> 10))) | 0);
                  var t2 = (rr(a, 2) ^ rr(a, 13) ^ rr(a, 22)) + ((a & h[1]) ^ (a & h[2]) ^ (h[1] & h[2]));
                  h = [(t1 + t2) | 0].concat(h);
                  h[4] = (h[4] + t1) | 0;
                }
                for (i = 0; i < 8; i++) h[i] = (h[i] + oh[i]) | 0;
              }
              for (i = 0; i < 8; i++) {
                for (j = 3; j + 1; j--) { var b = (h[i] >> (j * 8)) & 255; res += ((b < 16) ? 0 : '') + b.toString(16); }
              }
              return res;
            }
            
            // SHA-256 / HMAC / PBKDF2 sobre arreglos de bytes (ES5, Duktape). Para el login del GXV34xx.
            var GSK = [0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
            function gsSha256Bytes(m) {
              var H = [0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
              var l = m.length, n = ((l + 9 + 63) >> 6) << 6, b = new Array(n), i, j, W = new Array(64);
              for (i = 0; i < n; i++) b[i] = i < l ? m[i] : 0;
              b[l] = 0x80;
              var bits = l * 8;
              b[n - 1] = bits & 255; b[n - 2] = (bits >>> 8) & 255; b[n - 3] = (bits >>> 16) & 255; b[n - 4] = (bits >>> 24) & 255;
              for (j = 0; j < n; j += 64) {
                for (i = 0; i < 16; i++) W[i] = (b[j + 4 * i] << 24) | (b[j + 4 * i + 1] << 16) | (b[j + 4 * i + 2] << 8) | b[j + 4 * i + 3];
                for (i = 16; i < 64; i++) {
                  var x = W[i - 15], y = W[i - 2];
                  var s0 = ((x >>> 7) | (x << 25)) ^ ((x >>> 18) | (x << 14)) ^ (x >>> 3);
                  var s1 = ((y >>> 17) | (y << 15)) ^ ((y >>> 19) | (y << 13)) ^ (y >>> 10);
                  W[i] = (W[i - 16] + s0 + W[i - 7] + s1) | 0;
                }
                var a = H[0], c = H[2], d = H[3], e = H[4], f = H[5], g = H[6], h = H[7], bb = H[1];
                for (i = 0; i < 64; i++) {
                  var S1 = ((e >>> 6) | (e << 26)) ^ ((e >>> 11) | (e << 21)) ^ ((e >>> 25) | (e << 7));
                  var t1 = (h + S1 + ((e & f) ^ (~e & g)) + GSK[i] + W[i]) | 0;
                  var S0 = ((a >>> 2) | (a << 30)) ^ ((a >>> 13) | (a << 19)) ^ ((a >>> 22) | (a << 10));
                  var t2 = (S0 + ((a & bb) ^ (a & c) ^ (bb & c))) | 0;
                  h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = bb; bb = a; a = (t1 + t2) | 0;
                }
                H[0] = (H[0] + a) | 0; H[1] = (H[1] + bb) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0;
                H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
              }
              var out = [];
              for (i = 0; i < 8; i++) out.push((H[i] >>> 24) & 255, (H[i] >>> 16) & 255, (H[i] >>> 8) & 255, H[i] & 255);
              return out;
            }
            function gsUtf8(s) {
              s = unescape(encodeURIComponent(s));
              var a = [], i;
              for (i = 0; i < s.length; i++) a.push(s.charCodeAt(i));
              return a;
            }
            function gsHex(a) {
              var s = '', i;
              for (i = 0; i < a.length; i++) s += (a[i] < 16 ? '0' : '') + a[i].toString(16);
              return s;
            }
            function gsUnhex(h) {
              var a = [], i;
              for (i = 0; i + 1 < h.length; i += 2) a.push(parseInt(h.substr(i, 2), 16));
              return a;
            }
            function gsHmacPads(key) {
              if (key.length > 64) key = gsSha256Bytes(key);
              var ip = [], op = [], i;
              for (i = 0; i < 64; i++) { var k = i < key.length ? key[i] : 0; ip.push(k ^ 0x36); op.push(k ^ 0x5c); }
              return { ip: ip, op: op };
            }
            function gsHmac(pads, msg) {
              return gsSha256Bytes(pads.op.concat(gsSha256Bytes(pads.ip.concat(msg))));
            }
            // PBKDF2-HMAC-SHA256, una sola salida de 32 bytes (dkLen = 32).
            function gsPbkdf2(pw, salt, iter) {
              var pads = gsHmacPads(pw), u = gsHmac(pads, salt.concat([0, 0, 0, 1])), t = u.slice(0), i, j;
              for (i = 1; i < iter; i++) {
                u = gsHmac(pads, u);
                for (j = 0; j < 32; j++) t[j] ^= u[j];
              }
              return t;
            }
            // Secreto del login web GXV34xx: sha256(user:nonce:hex(HMAC(sha256(mac), PBKDF2(pw, rand, 10000))))
            function gsGxvSecret(user, pw, nonce, randHex, mac) {
              var m = gsPbkdf2(gsUtf8(pw), gsUnhex(randHex), 10000);
